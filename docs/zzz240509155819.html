<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" , interactive-widget=resizes-content">
    <title>List</title>
    <script src="https://h.jwint.net/static/crypto-js.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            overflow: hidden;
            overflow-y: auto; /* 只允許垂直捲動 */
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }
        .main-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .button-group {
            text-align: center;
        }
        .button-group button {
            padding: 10px 20px;
            margin: 5px;
            background-color: #007BFF;
            color: #fff; 
        }

        .tip {
            margin-top: 20px;
            padding: 10px;
            background-color: #f9f9f9; /* 淺灰色背景，區分顯示區域 */
            border: 1px solid #ddd;    /* 邊框 */
            border-radius: 4px;        /* 圓角 */
            
            /* 捲動關鍵設定 */
            /* height: 200px;             /* 設定固定高度，超過此高度會出現捲軸 */
            height: 100vbh;             /* 設定高度為視口高度，確保在小螢幕上也能使用捲軸 */
            overflow-y: auto;          /* 垂直方向內容超過時自動顯示捲軸 */
            
            /* 文字細節設定 */
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            word-wrap: break-word;     /* 強制長英文單字換行，防止撐破容器 */
            white-space: pre-wrap;     /* 保留換行符號（如果你是用 \n 換行的話） */
        }
        </style>       
</head> 
<body>
    <div class="main-container">
        <h1>List</h1>
        <div class="input-group">

            <label for="nameInput">Book Name:</label>
            <input type="text" id="nameInput" placeholder="Enter book name">

            <label for="msgInput">Message:</label>
            <input type="text" id="msgInput" placeholder="Enter message">
        </div>
        <div class="button-group">
            <button id="getBtn">Get</button>
            <button id="nameBtn">Save</button>
            <button id="listBtn">Get List</button>
            <button id="delBtn">Delete</button>
        </div>
        <div class="tip">Hello!</div>
    </div>
</body>




<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzIAuTrBD3eI7uusVneoYF6P-f2RtqVLT2yrpHbWpghCTsfhGh6JdcMgKx2b6a3K7HX/exec"; 
const SALT = "Nxk98ahIR50AtZBiLxowpmhaWXQCg8E";
const APIKey = "3d46431496b772599fcf959885ccdea155508431ed67819db3e41079fa2d8a3cd547f596ec7c9d0b5621d6c39549297ae90ba14c663d738ec07194ad9ddeab82";

document.getElementById("nameBtn").addEventListener("click", btnSave);
document.getElementById("listBtn").addEventListener("click", btnList);
document.getElementById("delBtn").addEventListener("click", btnDelete); 
document.getElementById("getBtn").addEventListener("click", btnGet);


//get
function btnGet() {
    cleanShow();
    show(" === Getting file... === ");
    const name = document.getElementById("nameInput").value.trim();
    if (!name) {
        show("Please enter a file name to get.");
        return;
    }
    doGet(name).then(res => {
        if (res.status === "success") {
            show(`File content for ${res.key}: ${res.value}`);
            //console.log(`File content for `, res, res.value, res.key);
            setTag(res.tag);
            //console.log(`Tag of ${res.key}:`, getTag());
            document.getElementById("msgInput").value = res.value;
        } else {
            show(`Error getting file: ${res.message}`);
        }
        //console.log("res:", res);
    });
}


//save
let saveTag = "";
function setTag(T){
    saveTag = T;
    console.log("Tag updated to:", saveTag);
}
function getTag(){
    console.log("Current tag:", saveTag);
    return saveTag;
}
function btnSave() {
    cleanShow();
    //console.log(typeof test);
    //return;
    show(" === Saving file... === ");
    const name = document.getElementById("nameInput").value.trim();
    if (!name) {
        show("Please enter a book name to save.");
        return;
    }
    let msg = document.getElementById("msgInput").value.trim(); 
    if (!msg) {
        show("Please enter a message to save.");
        msg = "Hello, this is a test content for " + name;
    }

    //console.log("Tag before save:", getTag());
    const T = getTag();
    doSave(name, msg, T).then(res => {
        if (res.status === "success") {
            show(`File "${name}" saved successfully!`);
            //console.log(`book "${name}" saved successfully!`, res);
            setTag(res.tag);
            //console.log(`New tag for "${name}":`, getTag());
        } else {
            show(`Error saving book: ${res.message}`);
        }
        //console.log("res:", res);
    });
    
}   

//list
function btnList() {
    cleanShow();

    const key = document.getElementById("nameInput").value.trim();
    doGetAll(key).then(res => {
        if( res.status === "error") {
            show(`What is your bookname`);
            return;
            
        }
        show(" === Getting book list... === ");
        //show("books retrieved successfully!");
        //console.log("book List:", res);
        const value = res.value || [];
        value.sort((x, y) => x.orgFileName.localeCompare(y.orgFileName));
        /*
        value.forEach(file => {
            //show(JSON.stringify(file));
            show(`${file.fName} - ${file.orgFileName}`);
        });*/
        value.forEach(({ fName, orgFileName }) => {
            // 加入 Emoji，並將 fName 設為粗體，原檔名設為灰色
            show(`📄 <b>${fName}</b> <span style="color: gray; font-size: 0.9em;">(${orgFileName})</span>`);
        });
        console.log("res:", res);
    });
}   

//delete
function btnDelete() {
    cleanShow();
    show(" === Deleting book... === ");

    key = document.getElementById("nameInput").value.trim();
    if (!key) {
        show("Please enter a book name to delete.");
        return;
    }else {
        let message = CryptoJS.SHA512(CryptoJS.enc.Utf8.parse(key)).toString();
        console.log("Key:", key, "Hash:", message);
        show("It is "+message);
        //document.getElementById("msgInput").value = message;
    }

}



// update status
function show_old(message) {
    const tipElement = document.querySelector(".tip");
    if (tipElement) {
        tipElement.innerHTML += "<br>" + message;
    }
}

function show(...messages) {
    const tipElement = document.querySelector(".tip");
    if (tipElement) {
        // 使用空格將多個參數連接起來，你可以依照需求把 " " 換成其他分隔符號 (例如 ", ")
        tipElement.innerHTML += "<br>" + messages.join(" ");
    }
}

function cleanShow(){
    const tipElement = document.querySelector(".tip");
    if (tipElement) {
        tipElement.innerHTML = "";
    }
}

//API 封裝 ==============================================================

function generateToken(key) {
    // 取得當下的 UTC 年月日 (如 20260206)
    const kNow = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    const name = key;
    const rawString = APIKey + SALT + kNow + name;
    //const token = CryptoJS.SHA512(rawString).toString();
    const token = CryptoJS.SHA512(CryptoJS.enc.Utf8.parse(rawString)).toString();
    //console.log("生成 Token 的原始字串:", rawString, "生成的 Token:", token);
    
    // 使用 CryptoJS 產生 SHA512 雜湊字串
    return token;
} 



async function callApi(params) {
    //console.log("準備呼叫 API，參數:", params);
    const token = generateToken(params.key || "");

    // 組合 URL 參數
    const queryString = new URLSearchParams({
        ...params,
        token: token
    }).toString();
    //console.log("生成的 URL 參數:", queryString);
    const finalUrl = `${API_URL}?${queryString}`;
    //console.log("最終 API URL:", finalUrl);
    try {
        const response = await fetch(finalUrl);
        //console.log("API 請求結果:",response);
        const result = await response.json();
        //console.log("API 回應解析後的結果:", result);
        return result;
    } catch (error) {
        console.error("API 請求失敗:");
        console.log(error);
        //confirm("網路請求失敗，是否重試？");
        return { status: "error", message: "網路請求失敗" };
    }
}

async function callApiPost(params) {
    const token = generateToken(params.key || "");
    var ret = null;
      await fetch(API_URL, {
          method: "POST", 
          redirect: 'follow', 
          body: JSON.stringify({ ...params, token })
      })
      .then(res => res.json())
      .then(data => {
            //console.log(data);
            ret = data;
          if(data.status === "success") {
            //console.log(`上傳成功！`);
          } else {
            console.log( "上傳失敗: ");
            console.log(data);
          }
      })
      .catch(error => {
          console.log("錯誤: ");
          console.log(error);
          ret = { status: "error", message: "網路請求失敗" };
      });

      return ret;

}
// 1. 儲存資料 (Save)
async function doSave(key, inV, tag ) {
    const newV = {
        action: "save",
        key: key,
        value: inV,
        tag: tag
    };
    const res = await callApiPost(newV);
    let newRes = null;
    if(res.status === "success"){
        console.log(`File "${res.key}" doSave successfully!`, res);
        newRes = { status: res.status, message: res.message, key: res.key, value: res.value, tag: res.tag };
    } else {
        console.log(`Error saving file:`, res);
        newRes = { status: res.status, message: res.message, key: null, value: null, tag: null };
    }   
    return newRes;
}

// 2. 讀取單一資料 (Get)
async function doGet(key) {
    const res = await callApi({
        action: "get",
        key: key,
        value: "123456",
        tag:"AAAAAA"
    });
    //console.log("doGet 結果:", res);
    let newRes = null;
    if(res.status === "success"){
        console.log(`File "${res.key}" doGet successfully!`, res);
        newRes = { status: res.status, message: res.message, key: res.key, value: res.value, tag: res.tag };
    } else {
        console.log("讀取資料失敗:", res);
        newRes = { status: res.status, message: res.message, key: null, value: null, tag: null };
    }

    return newRes;
}

// 3. 讀取全部資料 (Get All)
async function doGetAll(key) {
    const res = await callApi({
        action: "listwholetheworldandshowhelloworldhere",
        key: key
    });
    //console.log("doGetAll 結果:", res);
    return res;
}

// 4. 刪除資料 (Delete)
async function doDelete(key) {
    const res = await callApi({
        action: "delete",
        key: key
    });
    //console.log("Delete 結果:", res);
    return res;
}



</script>
