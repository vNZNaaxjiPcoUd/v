<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" , interactive-widget=resizes-content">
    <title>List</title>
    <script src="https://h.jwint.net/static/crypto-js.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            overflow: hidden;
            overflow-y: auto; /* 只允許垂直捲動 */
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }
        .main-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .button-group {
            text-align: center;
        }
        .button-group button {
            padding: 10px 20px;
            margin: 5px;
            background-color: #007BFF;
            color: #fff; 
        }

        .tip {
            margin-top: 20px;
            padding: 10px;
            background-color: #f9f9f9; /* 淺灰色背景，區分顯示區域 */
            border: 1px solid #ddd;    /* 邊框 */
            border-radius: 4px;        /* 圓角 */
            
            /* 捲動關鍵設定 */
            /* height: 200px;             /* 設定固定高度，超過此高度會出現捲軸 */
            height: 100vbh;             /* 設定高度為視口高度，確保在小螢幕上也能使用捲軸 */
            overflow-y: auto;          /* 垂直方向內容超過時自動顯示捲軸 */
            
            /* 文字細節設定 */
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            word-wrap: break-word;     /* 強制長英文單字換行，防止撐破容器 */
            white-space: pre-wrap;     /* 保留換行符號（如果你是用 \n 換行的話） */
        }
        </style>       
</head> 
<body>
    <div class="main-container">
        Hello my world!
    </div>
</body>


</body>
</html>
