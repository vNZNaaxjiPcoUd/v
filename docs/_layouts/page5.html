<script defer>
	//  clock show local time, and update every second.
    const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;


    function showTime() {
      const currentDate = new Date();
      const options = { timeZone: timeZone, hour: '2-digit', minute: '2-digit', second: '2-digit'};
      const timestamp = currentDate.toLocaleString('en-US', options);
      let labelElement = document.getElementById("cnT");
      labelElement.innerHTML = timestamp;
    }    


    setInterval(showTime, 1000);
    showTime();
</script>

// show a url page in a div, and update it when the url content changed.

async function showPage(srcURL,divN){
    const response = await fetch(srcURL);
    if (!response.ok) {
        //console.log(`無法載入檔案 (HTTP ${response.status})`);
        document.getElementById(divN).innerHTML = `<p class="hint">提取有問題 (${response.status})</p>` ;

    document.getElementById(divN).innerHTML = newHTML ;
}

	// check site timer update and continue screen.

<script defer>
	// open the locked content
const PASSWORD = "d0a4b3d376be0af335a4d748e48327cbc6a4fd9e12dbfef2cea690cf2393319f65ff1deef529a0bf49826c408ba4c757788bcf4cf9ad7b7a85ea018a57540087";
const SALT = "f862f1d08bf480f0a6c1f8db1914330976935c513eb154813220bad9fccad8a53f96d6ca0a12cead5d5fb2a65cbbd6e27d3b31d622f38c731e18de1d669df512d565ecea212aae"
let buffer = [];        
const allText = `{{ content }}`;
const MAX_BUFFER = 99;

async function hashPassword(password, salt) {
    const encoder = new TextEncoder(); 
    const data = encoder.encode(password + salt); 
    const hashBuffer = await crypto.subtle.digest('SHA-512', data);
    const hashArray = new Uint8Array(hashBuffer);
    const hashHex = Array.from(hashArray).map(byte => byte.toString(16).padStart(2, '0')).join(''); 
    return hashHex;
}

let statePsCheck = false;  //密碼驗證狀態, if yes, show the content, otherwise not.
async function checkPassword(inputPassword, storedSalt, storedHash) {
    const inputHash = await hashPassword(inputPassword, storedSalt);
    if (inputHash === storedHash) {
        //console.log("密碼正確！");
        statePsCheck = true;
		return true;
    } else {
        //console.log("密碼錯誤！");
		return false;
    }
}

// show allText content when password correct, and hide the input process.
function showContent() {
    document.getElementById("allT").innerHTML = allText ;
    //document.getElementsByClassName("msg")[0].style.display = "none";
    document.getElementById("msg").style.display = "none";
    document.getElementById("secretArea").style.display = "block";
    document.getElementById("helloWorld").style.display = "none";
    document.getElementById("passwordOverlay").style.display = "none";
    document.removeEventListener("keydown", arguments.callee);
    buffer = []; 
}

document.addEventListener("keydown", async function(e) {
    if (e.key.length === 1) {
        buffer.push(e.key.toLowerCase()); 

        if (buffer.length > MAX_BUFFER) {
            buffer.shift();
        }
        if (e.key === ' ') { 
			e.preventDefault();
			window.scrollTo({ top: 0, behavior: 'smooth' });
			buffer=[]; 

		}else if ( await checkPassword(buffer.join(""), SALT, PASSWORD) ) {
			showContent();
        }else{
            //console.log(`目前輸入: ${buffer.join("")}`);  
        }
		updateDisplay();
    }
    if (e.key === "Backspace") {
        buffer.pop();
    }
});

const display = document.getElementById("helloWorld");
function updateDisplay() { // show the key input
    if (buffer.length === 0) {
        display.textContent = 'Hello! your message send! wait response!';           // 沒輸入就清空
        return;
    }
    // 最後一個字元明文顯示，其他用 • 代替
    //const masked = '•'.repeat(buffer.length - 1) + buffer[buffer.length - 1];
    //display.textContent = masked;
    display.textContent = buffer.join("");
}

document.getElementById("helloWorld").onclick = function() {
	document.getElementById("passwordOverlay").style.display = "flex";
    document.getElementById("passwordInput").focus();
    this.style.display = "none";  // 隱藏 HelloWorld
};

// display none of password input
function disablePasswordInput() {
    const input = document.getElementById("passwordInput");
    input.value = "";
    input.placeholder = "訊息內容";
    input.style.borderBottomColor = "#00ff88";
    document.getElementById("passwordOverlay").style.display = "none";
    document.getElementById("helloWorld").style.display = "block";
    buffer = []; // 清空緩衝區
    updateDisplay();
}

document.getElementById("passwordInput").onkeydown = async function(e) {
    if (e.key === "Enter") {
        if (await checkPassword(this.value, SALT, PASSWORD)) {
            showContent();
        } else {
            disablePasswordInput();
        }
    }else if (e.key === "Escape") {
        disablePasswordInput();
    }
};

</script>

<script>
    // 搜尋功能, 核心邏輯，包含搜尋和高亮顯示
    let searchT = "";

	document.getElementById("searchF").style.display = "none";
	document.getElementById("icon").onclick = function() {
        console.log('icon clicked');
        if(statePsCheck == false){
            return;
        }
		if ( document.getElementById("searchF").style.display === "none"){
			document.getElementById("searchF").style.display = "block";
		}else{
			document.getElementById("searchF").style.display = "none";
		}
	};

    // 搜尋按鈕點擊事件
    document.getElementById('searchButton').addEventListener('click', function() {
        const searchText = document.getElementById('searchInput').value.trim();
        if (searchText) {
            searchT = searchText;
            performSearch(searchT, false); // 開始新的搜尋
        }
    });

    // 監聽 Enter 鍵找下一個
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            const searchText = document.getElementById('searchInput').value.trim();
            if (searchText) {
                // 如果搜尋文字變了，重新開始；否則找下一個
                if (searchText !== searchT) {
                    searchT = searchText;
                    performSearch(searchT, false);
                } else {
                    performSearch(searchT, true);
                }
                event.preventDefault(); // 防止表單提交或換行
            }
        }
    });

/**
 * 核心搜尋函數
 * @param {string} text - 要搜尋的文字
 * @param {boolean} next - 是否搜尋下一個
 */
    // 記錄目前的高亮元素，用來下次搜尋前清除
    let currentHighlight = null;

    function performSearch(text, next) {
        const container = document.getElementById('showworld');
        const selection = window.getSelection();

        // --- 步驟 1: 確保搜尋是從 container 內部開始 ---
        // 如果目前沒選取東西，或者選取的位置不在 showworld 內
        if (selection.rangeCount === 0 || 
            !container.contains(selection.anchorNode)) {
            resetCursorToStart(container);
        }

        // --- 步驟 2: 執行搜尋 ---
        // 重點：第4個參數(Wrap Around)設為 false！
        // 因為我們要自己控制只在 div 內循環，不讓它亂跳到頁首頁尾
        const found = window.find(text, false, false, false, false, false, false);

        // --- 步驟 3: 清除上一次的高亮 ---
        if (currentHighlight) {
            const parent = currentHighlight.parentNode;
            while (currentHighlight.firstChild) {
                parent.insertBefore(currentHighlight.firstChild, currentHighlight);
            }
            parent.removeChild(currentHighlight);
            currentHighlight = null;
        }

        // --- 步驟 4: 檢查搜尋結果是否有效 ---
        if (found) {
            const range = selection.getRangeAt(0);
            
            // 檢查：找到的文字真的在 showworld 裡面嗎？
            // (因為 window.find 有時會跨越邊界找到外面的字)
            if (container.contains(range.commonAncestorContainer)) {
                
                // === 這裡執行高亮邏輯 ===
                const span = document.createElement('span');
                span.style.backgroundColor = "yellow";
                
                try {
                    range.surroundContents(span);
                    currentHighlight = span;
                    
                    // 讓該元素滾動到視野中 (如果是 div 內捲動，這行也很重要)
                    span.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    
                    // 修正游標位置到高亮字之後，以便找下一個
                    selection.collapseToEnd();
                    
                } catch (e) {
                    console.warn("無法高亮 (可能跨標籤)", e);
                }

            } else {
                // 雖然 found 為 true，但找到的字在 container 外面 (例如 footer)
                console.log("找到的字在範圍外，視為結束");
                handleEndOfSearch(container);
            }
        } else {
            // 完全找不到 (found 為 false)
            console.log("找不到更多結果");
            handleEndOfSearch(container);
        }
    }

    // 輔助函式：當搜完一輪或出界時
    function handleEndOfSearch(container) {
        // 1. 清除選取 (避免高亮停留在外面)
        window.getSelection().removeAllRanges();
        
        // 2. 跳出提示
        // alert('搜尋範圍結束，將回到開頭。');
        console.log('搜尋範圍結束，將回到開頭。');

        // 3. 重置游標到 container 開頭，準備下一次點擊
        resetCursorToStart(container);
    }

    // 輔助函式：將游標重置到指定容器的開頭
    function resetCursorToStart(element) {
        const range = document.createRange();
        // 將範圍設定為 element 的第一個子節點之前
        range.setStart(element, 0); 
        range.collapse(true); // 摺疊成游標

        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        
        // 如果 div 有捲軸，也滾回最上面
        element.scrollTop = 0;
    }

</script>
